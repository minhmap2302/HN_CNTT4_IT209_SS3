# Virtual Host 1: Beta App trên Cổng 8080
server {
    listen 8080;
    listen [::]:8080;

    server_name _;
    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Virtual Host 2: Internal App trên Cổng 8090
server {
    listen 8090;
    listen [::]:8090;

    server_name _;
    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
