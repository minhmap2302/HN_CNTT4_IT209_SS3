server {
    listen 80;
    server_name _;

    root /var/www/my-web/html;
    index index.html;

    # Bảo vệ thư mục nhạy cảm /admin bằng Basic Auth
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
